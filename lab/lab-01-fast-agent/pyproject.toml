[project]
name = "lab-01-fast-agent"
version = "0.1.0"
description = "LAB-01 fast-agent standalone spike against the LAB-00-v2 arena"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fast-agent-mcp>=0.10.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab01"]

[tool.uv]
package = true
prerelease = "allow"

